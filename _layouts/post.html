---
layout: devlog
---
<article class="post">
  <a class="post-back small text-secondary text-decoration-none" href="{{ '/devlog/' | relative_url }}"
    >← All posts</a
  >

  <h1 class="mt-3">{{ page.title }}</h1>
  <p class="case-meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time>
  </p>

  <div class="post-content">{{ content }}</div>
</article>
