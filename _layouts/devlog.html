<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% if page.title %}{{ page.title }} | {% endif %}Lindsay Comeau</title>
    <meta
      name="description"
      content="{{ page.description | default: page.excerpt | default: 'Devlog by Lindsay Comeau: notes on UX, level design, and game development.' | strip_html | strip_newlines | truncate: 160 }}"
    />

    <!-- Social link previews (LinkedIn, Discord, etc.) -->
    <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}" />
    <meta property="og:title" content="{{ page.title | default: 'Devlog' }} | Lindsay Comeau" />
    <meta property="og:url" content="{{ page.url | absolute_url }}" />

    <!-- Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Custom styles (loaded after Bootstrap so overrides apply) -->
    <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}" />
  </head>
  <body>
    {% include site-nav.html %}

    <main class="devlog">
      <div class="container devlog-container">{{ content }}</div>
    </main>

    <footer>
      <p>© {{ 'now' | date: '%Y' }} Lindsay Comeau | Designed &amp; Built by Lindsay Comeau</p>
    </footer>

    <!-- Bootstrap JS bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
